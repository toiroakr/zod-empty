name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.13.0, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js for build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:sample
      - name: Use Node.js ${{ matrix.node-version }} for tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify ESM and CommonJS builds
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { init } from "./dist/index.mjs";
          import { z } from "zod";
          const { init: initCjs } = createRequire(import.meta.url)("./dist/index.cjs");
          const schema = z.object({ name: z.string() });
          assert.deepEqual(init(schema), { name: "" });
          assert.deepEqual(initCjs(schema), { name: "" });
          JS
      - run: pnpm test
      - uses: ./.github/workflows/actions/coverage-report
        with:
          token: ${{secrets.GITHUB_TOKEN}}
        if: ${{ startsWith(matrix.node-version, '16.') }}
        # FIXME: This is a workaround for comment on PRs from forks
        continue-on-error: true

  peer-floor:
    name: peer-floor (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Verifies the peerDependencies lower bounds declared in package.json
    # (zod, typescript) actually install and pass build+test, since Renovate
    # only ever widens peerDependencies ranges and never installs the floor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zod floor
            zod: "4.0.0"
          - name: typescript floor
            typescript: "5.0.2"
          - name: zod + typescript floor
            zod: "4.0.0"
            typescript: "5.0.2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install peerDependencies floor versions
        run: |
          set -eo pipefail
          if [ -n "${{ matrix.zod }}" ]; then pnpm add -Dw zod@${{ matrix.zod }}; fi
          if [ -n "${{ matrix.typescript }}" ]; then pnpm add -Dw typescript@${{ matrix.typescript }}; fi
      - run: pnpm build
      - run: pnpm test -- --run
