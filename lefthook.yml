rc: ~/.lefthookrc
pre-commit:
  commands:
    format:
      glob: "*.{js,ts,cjs,mjs,mts,cts,jsx,tsx,json,jsonc,css,html,md,yml,yaml}"
      run: pnpm exec oxfmt --check {staged_files}
    lint:
      glob: "*.{js,ts,cjs,mjs,mts,cts,jsx,tsx}"
      run: pnpm exec oxlint --deny-warnings {staged_files}
    test:
      glob: "*.{ts,mts,tsx}"
      run: pnpm test
